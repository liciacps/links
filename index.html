<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licia Santos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F0E0C;
    --surface: #1A1916;
    --surface2: #242220;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #F0EDE6;
    --text-muted: #8A877F;
    --text-dim: #5A5750;
    --accent: #D4C5A9;
    --accent-warm: #C4A882;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(196,168,130,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.25rem;
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .name {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 0.4rem;
    text-align: center;
  }

  .tagline {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    text-align: center;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 3rem;
  }

  .link-card {
    display: block;
    width: 100%;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 16px 20px;
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .link-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--accent-warm);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .link-card:hover {
    border-color: var(--border-hover);
    background: var(--surface2);
    transform: translateY(-1px);
  }

  .link-card:hover::before {
    opacity: 1;
  }

  .link-card:active {
    transform: translateY(0);
  }

  .link-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .link-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .link-title svg {
    flex-shrink: 0;
    opacity: 0.4;
    transition: opacity 0.2s;
  }

  .link-card:hover .link-title svg {
    opacity: 0.8;
  }

  .link-desc {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.5;
  }

  .tiktok-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    text-decoration: none;
    padding: 8px 16px;
    border: 0.5px solid var(--border);
    border-radius: 20px;
    transition: color 0.2s, border-color 0.2s;
  }

  .tiktok-btn:hover {
    color: var(--accent);
    border-color: var(--border-hover);
  }

  .footer {
    margin-top: 2.5rem;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    font-weight: 300;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="container">

  <div class="avatar">LS</div>
  <div class="name">Licia Santos</div>
  <div class="tagline">Psicologia das decisões</div>

  <div class="links">

    <a class="link-card" href="https://liciacps.github.io/quiz/" target="_blank">
      <div class="link-tag">Quiz</div>
      <div class="link-title">
        Falácia do Custo Irrecuperável
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="link-desc">Descubra se o passado está controlando suas decisões</div>
    </a>

    <a class="link-card" href="https://serene-monstera-7ec5b3.netlify.app/" target="_blank">
      <div class="link-tag">Quiz</div>
      <div class="link-title">
        Síndrome da Impostora
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="link-desc">Você duvida das suas próprias conquistas?</div>
    </a>

  </div>

  <a class="tiktok-btn" href="https://www.tiktok.com/@liciasantos.oficial" target="_blank">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/></svg>
    @liciasantos.oficial
  </a>

  <div class="footer">© Licia Santos</div>

</div>

</body>
</html>
